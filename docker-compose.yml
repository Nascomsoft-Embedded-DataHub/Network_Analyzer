services:
  db:
    image: postgres:16-alpine
    container_name: network-analyser-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: network_analyser
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d network_analyser']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
